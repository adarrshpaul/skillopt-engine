syntax = "proto3";

package admission;

service AdmissionService {
  rpc Admit(AdmitRequest) returns (AdmitResponse);
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message AdmitRequest {
  string id = 1;
  int32 priority = 2; // 1: Interactive, 2: Orchestration, 3: Background
  string payload = 3;
}

message AdmitResponse {
  string action = 1; // start, queued, scheduled, reject, preempt
  string reason = 2;
  string checkpoint_token = 3; // present when preempting a P2 task
  string code = 4; // rejection code (e.g. P1_RATE_LIMIT, P2_QUEUE_FULL, P3_THROTTLED)
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  string status = 1; // SERVING, NOT_SERVING
}
