<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillOpt Master Cockpit</title>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Cytoscape.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        #cy {
            width: 100%;
            height: 100%;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.2s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('chat'); // 'chat', 'telemetry', 'projects', 'fleet'
            const [chatMessages, setChatMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [selectedNode, setSelectedNode] = useState(null);
            const cyRef = useRef(null);
            const cyContainerRef = useRef(null);
            const [isLoading, setIsLoading] = useState(false);

            // Telemetry state
            const [telemetry, setTelemetry] = useState({ p1_tokens: 20.0, p2_queue_length: 0, p3_pending_jobs: 0, total_preemptions: 0, preempted_tasks: [] });
            
            // Projects & Files state
            const [files, setFiles] = useState([]);
            const [interactions, setInteractions] = useState([]);
            const [selectedFileContent, setSelectedFileContent] = useState('');
            const [selectedFilePath, setSelectedFilePath] = useState('');

            // Fleet state
            const [fleet, setFleet] = useState(null);

            // Fetch Telemetry on tab switch & interval
            useEffect(() => {
                const fetchTelemetry = async () => {
                    try {
                        const res = await fetch('/api/telemetry');
                        if (res.ok) {
                            const data = await res.json();
                            setTelemetry(data);
                        }
                    } catch (e) {}
                };
                fetchTelemetry();
                const interval = setInterval(fetchTelemetry, 3000);
                return () => clearInterval(interval);
            }, []);

            // Fetch Files & Interactions
            useEffect(() => {
                if (activeTab === 'projects') {
                    fetch('/api/files').then(r => r.json()).then(d => setFiles(d.files || [])).catch(() => {});
                    fetch('/api/interactions').then(r => r.json()).then(d => setInteractions(d || [])).catch(() => {});
                } else if (activeTab === 'fleet') {
                    fetch('/api/fleet').then(r => r.json()).then(d => setFleet(d)).catch(() => {});
                } else if (activeTab === 'telemetry') {
                    fetch('/api/interactions').then(r => r.json()).then(d => setInteractions(d || [])).catch(() => {});
                }
            }, [activeTab]);

            // Initialize Cytoscape
            useEffect(() => {
                if (activeTab !== 'chat') return;
                cyRef.current = cytoscape({
                    container: cyContainerRef.current,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#3b82f6',
                                'label': 'data(id)',
                                'color': '#f8fafc',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'font-size': '12px',
                                'width': '50px',
                                'height': '50px',
                                'border-width': 2,
                                'border-color': '#60a5fa'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 2,
                                'line-color': '#475569',
                                'target-arrow-color': '#475569',
                                'target-arrow-shape': 'triangle',
                                'curve-style': 'bezier'
                            }
                        },
                        {
                            selector: ':selected',
                            style: {
                                'background-color': '#10b981',
                                'border-color': '#34d399',
                                'border-width': 3
                            }
                        }
                    ],
                    layout: { name: 'preset' }
                });

                cyRef.current.on('tap', 'node', (evt) => {
                    const node = evt.target;
                    setSelectedNode({
                        id: node.id(),
                        ...node.data()
                    });
                });

                fetchGraphData();

                return () => {
                    if (cyRef.current) {
                        cyRef.current.destroy();
                    }
                };
            }, [activeTab]);

            const fetchGraphData = async () => {
                try {
                    const res = await fetch('/api/graph');
                    const data = await res.json();
                    if (!cyRef.current) return;
                    cyRef.current.elements().remove();
                    
                    const cyElements = [];
                    (data.nodes || []).forEach(n => {
                        cyElements.push({
                            group: 'nodes',
                            data: {
                                id: n.id,
                                type: n.type,
                                content: n.content,
                                metadata: n.metadata,
                                checkpointToken: n.checkpoint_token
                            }
                        });
                    });
                    (data.edges || []).forEach(e => {
                        cyElements.push({
                            group: 'edges',
                            data: {
                                id: `${e.src}-${e.dst}`,
                                source: e.src,
                                target: e.dst,
                                label: e.label
                            }
                        });
                    });

                    cyRef.current.add(cyElements);
                    cyRef.current.layout({
                        name: 'cose',
                        animate: true,
                        padding: 50
                    }).run();
                } catch (err) {}
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!inputValue.trim() || isLoading) return;

                const userMsg = inputValue;
                setInputValue('');
                setChatMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
                setIsLoading(true);

                try {
                    const res = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: userMsg, priority: 1 })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        setChatMessages(prev => [...prev, { 
                            sender: 'system', 
                            text: `❌ Error (${res.status}): ${data.detail || 'Model Inference Server unreachable.'}` 
                        }]);
                    } else {
                        setChatMessages(prev => [...prev, { 
                            sender: 'system', 
                            text: `✅ Action: ${data.action} | Node ID: ${data.node_id}` 
                        }]);
                        await fetchGraphData();
                    }
                } catch (err) {
                    setChatMessages(prev => [...prev, { sender: 'system', text: `❌ Network Error: ${err.message}` }]);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleResume = async (token) => {
                try {
                    const res = await fetch('/api/resume', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ checkpoint_token: token })
                    });
                    const data = await res.json();
                    alert(`Resume status: ${data.status}`);
                    fetchGraphData();
                } catch (err) {
                    alert('Error sending resume request');
                }
            };

            const loadFileContent = async (path) => {
                setSelectedFilePath(path);
                try {
                    const res = await fetch(`/api/file?path=${encodeURIComponent(path)}`);
                    const data = await res.json();
                    setSelectedFileContent(data.content || '');
                } catch (e) {
                    setSelectedFileContent('Error loading file');
                }
            };

            return (
                <div className="flex flex-col h-screen w-screen bg-brand-900 text-gray-100">
                    {/* Header Top Bar with Unified Navigation Tabs */}
                    <header className="h-14 bg-brand-800 border-b border-brand-700/80 px-6 flex justify-between items-center z-20">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-lg bg-brand-accent flex items-center justify-center font-bold text-white shadow-md shadow-blue-500/20">
                                S
                            </div>
                            <h1 className="font-bold text-lg text-white tracking-wide">SkillOpt Master Cockpit</h1>
                            <span className="bg-blue-500/10 text-blue-400 text-xs px-2.5 py-1 rounded border border-blue-500/20 font-mono">v2.1</span>
                        </div>

                        {/* Master Tabs */}
                        <div className="flex bg-brand-900/80 p-1 rounded-lg border border-brand-700/60 text-sm">
                            <button
                                onClick={() => setActiveTab('chat')}
                                className={`px-4 py-1.5 rounded-md font-medium transition-all ${activeTab === 'chat' ? 'bg-brand-accent text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                                💬 Graph Chat
                            </button>
                            <button
                                onClick={() => setActiveTab('telemetry')}
                                className={`px-4 py-1.5 rounded-md font-medium transition-all ${activeTab === 'telemetry' ? 'bg-brand-accent text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                                ⚡ Telemetry & Admission
                            </button>
                            <button
                                onClick={() => setActiveTab('projects')}
                                className={`px-4 py-1.5 rounded-md font-medium transition-all ${activeTab === 'projects' ? 'bg-brand-accent text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                                🛠️ IDE & Projects
                            </button>
                            <button
                                onClick={() => setActiveTab('fleet')}
                                className={`px-4 py-1.5 rounded-md font-medium transition-all ${activeTab === 'fleet' ? 'bg-brand-accent text-white shadow' : 'text-gray-400 hover:text-white'}`}
                            >
                                🎛️ Model Fleet
                            </button>
                        </div>

                        <div className="flex items-center gap-4 text-xs text-gray-400">
                            <span className="flex items-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Ingress: :5002
                            </span>
                        </div>
                    </header>

                    {/* Tab 1: Graph Chat (3-Pane Layout) */}
                    {activeTab === 'chat' && (
                        <div className="flex-1 grid grid-cols-12 overflow-hidden">
                            {/* Left Pane: Chat Stream */}
                            <div className="col-span-3 bg-brand-900 border-r border-brand-800 flex flex-col h-full z-10 shadow-lg">
                                <div className="p-4 border-b border-brand-800 flex justify-between items-center bg-brand-900">
                                    <h2 className="text-base font-semibold flex items-center gap-2 text-white">
                                        <svg className="w-5 h-5 text-brand-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                                        Chat Stream
                                    </h2>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-4">
                                    {chatMessages.length === 0 ? (
                                        <div className="text-center text-gray-500 py-8 text-sm">
                                            Send an instruction to populate the visual execution graph
                                        </div>
                                    ) : (
                                        chatMessages.map((msg, index) => (
                                            <div key={index} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                                                <div className={`max-w-[85%] rounded-lg p-3 text-sm shadow-sm ${msg.sender === 'user' ? 'bg-brand-accent text-white' : 'bg-brand-800 border border-brand-700/80 text-gray-200'}`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <form onSubmit={handleSend} className="p-4 border-t border-brand-800 bg-brand-900 flex gap-2">
                                    <input 
                                        type="text" 
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        placeholder="Type instruction..." 
                                        className="flex-1 bg-brand-800 border border-brand-700/80 rounded-md px-3 py-2 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-brand-accent"
                                    />
                                    <button type="submit" disabled={isLoading} className="bg-brand-accent hover:bg-blue-600 px-4 py-2 rounded-md font-medium text-sm text-white transition-colors shadow">
                                        {isLoading ? '...' : 'Send'}
                                    </button>
                                </form>
                            </div>

                            {/* Center Pane: Cytoscape Canvas */}
                            <div className="col-span-6 bg-[#090d16] relative h-full">
                                <div className="absolute top-4 left-4 z-10">
                                    <h2 className="text-sm font-medium text-gray-300 backdrop-blur-md bg-brand-900/60 px-3 py-1.5 rounded border border-brand-800/80 shadow-sm flex items-center gap-2">
                                        Graph Explorer
                                    </h2>
                                </div>
                                <div className="absolute top-4 right-4 z-10 flex gap-2">
                                    <button onClick={() => cyRef.current && cyRef.current.fit()} className="bg-brand-800/60 hover:bg-brand-700/80 text-gray-300 backdrop-blur-md p-2 rounded border border-brand-700/80">Fit</button>
                                    <button onClick={fetchGraphData} className="bg-brand-800/60 hover:bg-brand-700/80 text-gray-300 backdrop-blur-md p-2 rounded border border-brand-700/80">Refresh</button>
                                </div>
                                <div id="cy" ref={cyContainerRef} className="w-full h-full cursor-grab active:cursor-grabbing"></div>
                            </div>

                            {/* Right Pane: Inspector */}
                            <div className="col-span-3 bg-brand-900 h-full flex flex-col border-l border-brand-800/50 p-4 overflow-y-auto">
                                <h2 className="text-base font-semibold text-white mb-4">Inspector</h2>
                                {selectedNode ? (
                                    <div className="space-y-4">
                                        <div className="bg-brand-800 p-4 rounded border border-brand-700 text-sm">
                                            <div className="text-gray-400">Node ID</div>
                                            <div className="font-mono font-medium text-white">{selectedNode.id}</div>
                                            <div className="text-gray-400 mt-2">Type</div>
                                            <div className="capitalize">{selectedNode.type}</div>
                                            <div className="text-gray-400 mt-2">Content</div>
                                            <div className="text-xs font-mono bg-brand-900 p-2 rounded mt-1 text-gray-300">{selectedNode.content}</div>
                                        </div>
                                        {selectedNode.checkpointToken && (
                                            <div className="bg-indigo-900/40 border border-indigo-700 p-4 rounded">
                                                <div className="text-xs text-indigo-300 mb-2">Checkpoint Token</div>
                                                <button onClick={() => handleResume(selectedNode.checkpointToken)} className="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded text-sm text-white font-medium">Resume Execution</button>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="text-gray-500 text-sm text-center py-10">Click a node to inspect details</div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Tab 2: Telemetry & Admission Dashboard */}
                    {activeTab === 'telemetry' && (
                        <div className="flex-1 p-8 overflow-y-auto bg-brand-900 space-y-6">
                            <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                ⚡ Admission Controller & Hardware Telemetry
                            </h2>
                            <div className="grid grid-cols-4 gap-6">
                                <div className="bg-brand-800 p-6 rounded-xl border border-brand-700/80 shadow">
                                    <div className="text-xs text-gray-400 font-semibold uppercase">P1 Token Bucket</div>
                                    <div className="text-3xl font-bold text-emerald-400 mt-2">{telemetry.p1_tokens} <span className="text-sm font-normal text-gray-400">tokens</span></div>
                                    <div className="text-xs text-gray-500 mt-2">Rate: 10/s | Burst: 20</div>
                                </div>
                                <div className="bg-brand-800 p-6 rounded-xl border border-brand-700/80 shadow">
                                    <div className="text-xs text-gray-400 font-semibold uppercase">P2 Queue Length</div>
                                    <div className="text-3xl font-bold text-blue-400 mt-2">{telemetry.p2_queue_length} <span className="text-sm font-normal text-gray-400">tasks</span></div>
                                    <div className="text-xs text-gray-500 mt-2">Planner FIFO Queue (Max: 50)</div>
                                </div>
                                <div className="bg-brand-800 p-6 rounded-xl border border-brand-700/80 shadow">
                                    <div className="text-xs text-gray-400 font-semibold uppercase">P3 Pending Jobs</div>
                                    <div className="text-3xl font-bold text-purple-400 mt-2">{telemetry.p3_pending_jobs} <span className="text-sm font-normal text-gray-400">jobs</span></div>
                                    <div className="text-xs text-gray-500 mt-2">FAISS Background Vector Work</div>
                                </div>
                                <div className="bg-brand-800 p-6 rounded-xl border border-brand-700/80 shadow">
                                    <div className="text-xs text-gray-400 font-semibold uppercase">Total Preemptions</div>
                                    <div className="text-3xl font-bold text-amber-400 mt-2">{telemetry.total_preemptions} <span className="text-sm font-normal text-gray-400">preempts</span></div>
                                    <div className="text-xs text-gray-500 mt-2">P1 burst preemption events</div>
                                </div>
                            </div>

                            <div className="bg-brand-800 rounded-xl border border-brand-700/80 p-6">
                                <h3 className="text-base font-semibold text-white mb-4">Preemption & Checkpoint Log</h3>
                                {telemetry.preempted_tasks.length === 0 ? (
                                    <div className="text-gray-500 text-sm py-4 text-center">No active preemption checkpoints recorded</div>
                                ) : (
                                    <table className="w-full text-left text-sm">
                                        <thead>
                                            <tr className="text-gray-400 border-b border-brand-700 text-xs uppercase">
                                                <th className="py-2">Task ID</th>
                                                <th className="py-2">Checkpoint Token</th>
                                                <th className="py-2">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {telemetry.preempted_tasks.map((t, idx) => (
                                                <tr key={idx} className="border-b border-brand-700/50 text-gray-200 font-mono text-xs">
                                                    <td className="py-3">{t.task_id}</td>
                                                    <td className="py-3 text-indigo-400">{t.checkpoint_token}</td>
                                                    <td className="py-3">
                                                        <button onClick={() => handleResume(t.checkpoint_token)} className="bg-indigo-600 px-3 py-1 rounded text-white text-xs">Resume</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>

                            <div className="bg-brand-800 rounded-xl border border-brand-700/80 p-6 mt-6">
                                <h3 className="text-base font-semibold text-white mb-4">Hardware Utilization & LLM Processing</h3>
                                {interactions.length === 0 ? (
                                    <div className="text-gray-500 text-sm py-4 text-center">No LLM processing records available</div>
                                ) : (
                                    <table className="w-full text-left text-sm">
                                        <thead>
                                            <tr className="text-gray-400 border-b border-brand-700 text-xs uppercase">
                                                <th className="py-2">Timestamp</th>
                                                <th className="py-2">Prompt Excerpt</th>
                                                <th className="py-2">Tokens Processed</th>
                                                <th className="py-2">Latency (ms)</th>
                                                <th className="py-2">Status</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {interactions.slice(0, 10).map((t, idx) => (
                                                <tr key={idx} className="border-b border-brand-700/50 text-gray-200 font-mono text-xs">
                                                    <td className="py-3 text-gray-400">{new Date(t.timestamp * 1000).toLocaleTimeString()}</td>
                                                    <td className="py-3 truncate max-w-xs">{t.task_prompt.length > 40 ? t.task_prompt.substring(0, 40) + '...' : t.task_prompt}</td>
                                                    <td className="py-3 text-emerald-400 font-bold">{t.tokens || 0}</td>
                                                    <td className="py-3 text-amber-400">{t.latency_ms ? t.latency_ms.toFixed(2) : '0.00'} ms</td>
                                                    <td className="py-3 text-indigo-400">{t.status}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Tab 3: IDE & Projects */}
                    {activeTab === 'projects' && (
                        <div className="flex-1 grid grid-cols-12 overflow-hidden bg-brand-900">
                            <div className="col-span-4 border-r border-brand-800 p-6 overflow-y-auto space-y-4">
                                <h3 className="text-sm font-semibold text-gray-300 uppercase tracking-wider">Workspace Files</h3>
                                <div className="space-y-1">
                                    {files.map((f, idx) => (
                                        <div key={idx} onClick={() => loadFileContent(f)} className={`p-2 rounded text-xs font-mono cursor-pointer transition-colors ${selectedFilePath === f ? 'bg-brand-accent text-white' : 'hover:bg-brand-800 text-gray-300'}`}>
                                            📄 {f}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="col-span-8 p-6 flex flex-col h-full bg-[#090d16]">
                                <h3 className="text-sm font-semibold text-gray-300 mb-2 font-mono">{selectedFilePath || 'Select a file to view content'}</h3>
                                <pre className="flex-1 bg-brand-900 p-4 rounded border border-brand-800 font-mono text-xs text-gray-300 overflow-y-auto">
                                    {selectedFileContent}
                                </pre>
                            </div>
                        </div>
                    )}

                    {/* Tab 4: Model Fleet */}
                    {activeTab === 'fleet' && (
                        <div className="flex-1 p-8 overflow-y-auto bg-brand-900 space-y-6">
                            <h2 className="text-xl font-bold text-white">🎛️ Model Fleet Governance</h2>
                            <div className="bg-brand-800 rounded-xl border border-brand-700/80 p-6 shadow">
                                <table className="w-full text-left text-sm">
                                    <thead>
                                        <tr className="text-gray-400 border-b border-brand-700 text-xs uppercase">
                                            <th className="py-3">Role</th>
                                            <th className="py-3">Model Name</th>
                                            <th className="py-3">Target Endpoint</th>
                                            <th className="py-3">Role Description</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {fleet && fleet.roles && Object.entries(fleet.roles).map(([role, cfg]) => (
                                            <tr key={role} className="border-b border-brand-700/50 text-gray-200">
                                                <td className="py-3 font-semibold uppercase text-brand-accent">{role}</td>
                                                <td className="py-3 font-mono text-xs">{cfg.model}</td>
                                                <td className="py-3 font-mono text-xs text-emerald-400">{cfg.url}</td>
                                                <td className="py-3 text-xs text-gray-400">{cfg.role_description}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
