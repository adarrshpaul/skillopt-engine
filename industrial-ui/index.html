<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Dashboard</title>
  
  <!-- Siemens iX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@siemens/ix@2.3.0/dist/siemens-ix/siemens-ix.css" />
  
  <!-- Siemens iX Web Components -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@siemens/ix@2.3.0/dist/siemens-ix/siemens-ix.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@siemens/ix@2.3.0/dist/siemens-ix/siemens-ix.js"></script>

  <!-- Siemens iX Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@siemens/ix-icons@2.1.0/dist/css/ix-icons.css" />
  
  <style>
    body {
      margin: 0;
      height: 100vh;
    }
    .grid-container {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .metric-value {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--theme-color-primary);
    }
    .table-container {
      padding: 16px;
      margin-top: 16px;
    }
  </style>
</head>
<body class="theme-dark">
  <ix-application>
    <ix-application-header name="Industrial UI Dashboard" slot="header">
      <div slot="logo">
        <ix-icon name="globe" size="24"></ix-icon>
      </div>
    </ix-application-header>
    
    <ix-menu slot="menu">
      <ix-menu-item icon="dashboard" active>Dashboard</ix-menu-item>
      <ix-menu-item icon="machine">Machines</ix-menu-item>
      <ix-menu-item icon="warning">Alarms</ix-menu-item>
      <ix-menu-settings>
        <ix-menu-item>Settings</ix-menu-item>
      </ix-menu-settings>
    </ix-menu>
    
    <div slot="content">
      <div class="grid-container">
        <!-- Metric Card 1 -->
        <ix-card variant="notification" icon="thermometer">
          <div slot="header">Core Temperature</div>
          <div class="metric-value">84.2°C</div>
          <ix-typography format="body">Status: Stable</ix-typography>
        </ix-card>
        
        <!-- Metric Card 2 -->
        <ix-card variant="notification" icon="speed">
          <div slot="header">Pressure Output</div>
          <div class="metric-value">124 PSI</div>
          <ix-typography format="body">Status: Optimal</ix-typography>
        </ix-card>
        
        <!-- Metric Card 3 -->
        <ix-card variant="notification" icon="time">
          <div slot="header">Uptime</div>
          <div class="metric-value">1,402 hrs</div>
          <ix-typography format="body">Status: Servicing Next Week</ix-typography>
        </ix-card>
      </div>

      <div class="table-container">
        <ix-typography format="h4">Recent Events</ix-typography>
        <ix-table id="event-table"></ix-table>
      </div>
    </div>
  </ix-application>
  
  <script>
    // Mock Table Data
    const table = document.getElementById('event-table');
    
    table.columns = [
      { id: 'time', header: 'Timestamp' },
      { id: 'severity', header: 'Severity' },
      { id: 'message', header: 'Event Message' }
    ];
    
    table.data = [
      { time: '10:42 AM', severity: 'Critical', message: 'Coolant pressure dropped below threshold' },
      { time: '10:15 AM', severity: 'Warning', message: 'Vibration detected on axis 4' },
      { time: '09:00 AM', severity: 'Info', message: 'Routine diagnostic completed successfully' }
    ];
  </script>
</body>
</html>
